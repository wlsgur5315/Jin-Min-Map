name: Apply strong native duplicate cleanup
on:
  push:
    paths:
      - 'tools/apply_native_strong_duplicates.py'
      - '.github/workflows/apply-native-strong-duplicates.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/apply_native_strong_duplicates.py
      - run: pip install shapely
      - run: python tools/diagnose_all_visual_overlaps.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buildings/*.geojson.gz data/manifest.json data/native_strong_duplicate_cleanup_report.json data/all_district_visual_overlap_diagnosis.json
          git commit -m "Remove strong native GIS duplicates outside Sangpyeong [skip ci]" || exit 0
          git pull --rebase origin main
          git push
