name: Plan safe overlap cleanup
on:
  push:
    paths:
      - 'tools/plan_safe_overlap_cleanup.py'
      - '.github/workflows/plan-safe-overlap-cleanup.yml'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install shapely
      - run: python tools/plan_safe_overlap_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/safe_overlap_cleanup_plan.json
          git commit -m "Plan safe building overlap cleanup [skip ci]" || exit 0
          git pull --rebase origin main
          git push
