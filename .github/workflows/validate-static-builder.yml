name: Validate static builder
on:
  push:
    paths:
      - '.github/workflows/validate-static-builder.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/build_all_static.py tools/fix_register_split_groups.py tools/classify_register_mismatch_types.py
