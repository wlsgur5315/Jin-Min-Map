name: Export SR1 parcel geo controls
on:
  push:
    paths:
      - .github/workflows/export-sr1-controls.yml
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install shapely
      - name: Print cadastral geometry coordinates
        run: |
          python - <<'PY'
          import gzip,json,glob
          from shapely.geometry import shape
          want={'1432-2','1432-3','1432-4','1432-5','1432-6','1432-7','1432-8','1436-1','1436-2','1436-3','1436-4','1436-5','1436-6','1436-7','1436-9','1436-10','1437-1','1437-2','1437-3','1437-4','1437-5','1437-8','1437-9','1437-10','1437-11','1437-12','639-1','639-6','639-11','639-15'}
          for fn in glob.glob('data/parcels/*.geojson.gz'):
           with gzip.open(fn,'rt') as f:ps=json.load(f)['features']
           for p in ps:
            q=p.get('properties') or {};j=str(q.get('jibun') or '').replace(' ','');label=j.rstrip('대답')
            if q.get('district_name')!='가호동' or label not in want:continue
            g=shape(p['geometry']);c=g.centroid
            print('CONTROL='+json.dumps({'lot':label,'pnu':q.get('pnu'),'lon':c.x,'lat':c.y,'geometry':p['geometry']},ensure_ascii=False,separators=(',',':')))
          PY
