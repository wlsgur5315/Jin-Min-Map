name: Suppress weak register matches
on:
  push:
    paths:
      - 'tools/suppress_weak_register_matches.py'
      - '.github/workflows/suppress-weak-register-matches.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/suppress_weak_register_matches.py
      - run: python tools/prioritize_register_area_mismatches.py
      - run: python tools/classify_register_mismatch_types.py
      - name: Commit weak-match fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buildings/*.geojson.gz data/manifest.json data/weak_register_match_fix_report.json data/register_area_mismatch_priority.json data/register_mismatch_type_analysis.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Suppress weak register height matches [skip ci]"
            git pull --rebase origin main
            git push
          fi
