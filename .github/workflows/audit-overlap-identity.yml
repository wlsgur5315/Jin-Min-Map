name: Audit overlap identity
on:
  push:
    paths:
      - 'tools/audit_overlap_identity.py'
      - '.github/workflows/audit-overlap-identity.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install shapely
      - run: python tools/audit_overlap_identity.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overlap_identity_audit.json
          git commit -m "Audit overlapping building identities [skip ci]" || exit 0
          git pull --rebase origin main
          git push
