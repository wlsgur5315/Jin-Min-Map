name: Inspect remaining PNU mismatches
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/inspect_remaining_pnu_mismatches.py'
      - '.github/workflows/inspect-remaining-pnu.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/inspect_remaining_pnu_mismatches.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pnu_mismatch_remaining.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Inspect remaining PNU mismatches [skip ci]"
            git pull --rebase origin main
            git push
          fi
