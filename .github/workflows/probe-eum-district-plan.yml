name: Probe EUM district-plan download
on:
  push:
    paths:
      - 'tools/probe_eum_district_plan.py'
      - '.github/workflows/probe-eum-district-plan.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python tools/probe_eum_district_plan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eum_district_plan_download_probe.json
          git commit -m "Probe EUM district-plan download endpoint [skip ci]" || exit 0
          git pull --rebase origin main
          git push
