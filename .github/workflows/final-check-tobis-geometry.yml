name: Final check Tobis geometry
on:
  push:
    paths:
      - 'tools/final_check_tobis_geometry.py'
      - '.github/workflows/final-check-tobis-geometry.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install shapely
      - run: python tools/final_check_tobis_geometry.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tobis_final_geometry_check.json
          git commit -m "Verify final Tobis geometry [skip ci]" || exit 0
          git pull --rebase origin main
          git push
