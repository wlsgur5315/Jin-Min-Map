name: Inspect parcel schema
on:
  push:
    paths:
      - 'tools/inspect_parcel_schema.py'
      - '.github/workflows/inspect-parcel-schema.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/inspect_parcel_schema.py
      - name: Commit parcel schema report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parcel_schema_report.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Inspect parcel attribute schema [skip ci]"
            git pull --rebase origin main
            git push
          fi
