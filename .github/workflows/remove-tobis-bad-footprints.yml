name: Remove Tobis bad footprints
on:
  push:
    paths:
      - 'tools/remove_tobis_bad_footprints.py'
      - '.github/workflows/remove-tobis-bad-footprints.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/remove_tobis_bad_footprints.py
      - run: pip install shapely
      - run: python tools/diagnose_all_visual_overlaps.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buildings/38030770.geojson.gz data/manifest.json data/tobis_bad_footprint_cleanup_report.json data/all_district_visual_overlap_diagnosis.json
          git commit -m "Remove erroneous Tobis hydraulic overlap footprints [skip ci]" || exit 0
          git pull --rebase origin main
          git push
