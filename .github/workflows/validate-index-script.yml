name: Validate index script
on:
  push:
    paths:
      - 'index.html'
      - 'eye-walk.js'
      - 'eye-walk.css'
      - 'tools/test-eye-walk.cjs'
      - 'tools/test-polygon-dimensions.cjs'
      - '.github/workflows/validate-index-script.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and syntax-check inline script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Check polygon dimension constraints
        run: node tools/test-polygon-dimensions.cjs
      - name: Check eye-level walk and collision
        run: |
          node --check eye-walk.js
          node tools/test-eye-walk.cjs
