name: Analyze height outlier priorities
on:
  push:
    paths:
      - 'tools/analyze_height_outlier_priorities.py'
      - '.github/workflows/analyze-height-outlier-priorities.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/analyze_height_outlier_priorities.py
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/height_outlier_priority_analysis.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Analyze height outlier priorities [skip ci]"
            git pull --rebase origin main
            git push
          fi
