name: Classify duplicate and height candidates
on:
  push:
    paths:
      - 'tools/classify_duplicate_height_candidates.py'
      - '.github/workflows/classify-duplicate-height-candidates.yml'
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/classify_duplicate_height_candidates.py
      - name: Commit classification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duplicate_height_candidate_classification.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Classify duplicate and height audit candidates [skip ci]"
            git pull --rebase origin main
            git push
          fi
