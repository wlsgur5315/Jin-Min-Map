name: Fix impossible low building heights
on:
  push:
    paths:
      - 'tools/fix_impossible_low_heights.py'
      - '.github/workflows/fix-impossible-low-heights.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/fix_impossible_low_heights.py
      - run: python tools/audit_building_geometry_height.py
      - run: python tools/classify_duplicate_height_candidates.py
      - name: Commit low-height fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buildings/*.geojson.gz data/manifest.json data/impossible_low_height_fix_report.json data/building_geometry_height_audit.json data/duplicate_height_candidate_classification.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Correct impossible low multi-storey heights [skip ci]"
            git pull --rebase origin main
            git push
          fi
