        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/audit_building_integrity.py
      - run: python tools/prioritize_register_area_mismatches.py
      - name: Commit verification reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/building_integrity_audit.json data/register_area_mismatch_priority.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify Jinju static rebuild [skip ci]"
            git pull --rebase origin main
