name: Build all Jinju static buildings
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_all_static.py'
      - '.github/workflows/build-all-static.yml'
permissions:
  contents: write
concurrency:
  group: build-all-jinju-static
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests shapely overturemaps
      - run: python tools/build_all_static.py
      - name: Commit all precomputed district datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buildings/*.geojson.gz data/manifest.json data/static_build_report_all.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Precompute all Jinju building datasets [skip ci]"
            git pull --rebase origin main
            git push
          fi
