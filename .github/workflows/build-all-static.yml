name: Build all Jinju static buildings
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_all_static.py'
      - '.github/workflows/build-all-static.yml'
permissions:
  contents: write
concurrency:
  group: build-all-jinju-static
  cancel-in-progress: false

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests shapely overturemaps
      - run: python tools/build_all_static.py --district 38030110 --district 38030310 --district 38030320 --district 38030330 --district 38030340
      - name: Commit batch 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buildings/*.geojson.gz data/manifest.json data/static_build_report_all.json
          if ! git diff --cached --quiet; then
            git commit -m "Precompute Jinju static batch 1 [skip ci]"
            git pull --rebase origin main
            git push
          fi

  batch2:
    needs: batch1
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests shapely overturemaps
      - run: python tools/build_all_static.py --district 38030350 --district 38030360 --district 38030370 --district 38030380 --district 38030390
      - name: Commit batch 2
        run: |
          git config user.name "github-actions[bot]"
