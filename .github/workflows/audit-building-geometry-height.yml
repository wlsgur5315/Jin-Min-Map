name: Audit building geometry and heights
on:
  push:
    paths:
      - 'tools/audit_building_geometry_height.py'
      - '.github/workflows/audit-building-geometry-height.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/audit_building_geometry_height.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/building_geometry_height_audit.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Audit building geometry and heights [skip ci]"
            git pull --rebase origin main
            git push
          fi
