name: Classify critical area mismatches
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/classify_critical_area_mismatches.py'
      - '.github/workflows/classify-critical-area.yml'
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/classify_critical_area_mismatches.py
      - name: Commit classification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/register_area_mismatch_classified.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Classify critical register area mismatches [skip ci]"
            git pull --rebase origin main
            git push
          fi
