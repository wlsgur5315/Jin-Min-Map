name: Inspect Chungmugong height outliers
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/inspect_chungmugong_heights.py'
      - '.github/workflows/inspect-chungmugong-heights.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/inspect_chungmugong_heights.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chungmugong_height_outliers.json
          git diff --cached --quiet || (git commit -m "Add Chungmugong height outlier report [skip ci]" && git push)
