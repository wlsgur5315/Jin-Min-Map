name: Inspect PNU legal names
on:
  push:
    paths:
      - 'tools/inspect_pnu_legal_names.py'
      - '.github/workflows/inspect-pnu-legal-names.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/inspect_pnu_legal_names.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pnu_legal_name_report.json
          git commit -m "Inspect PNU legal-dong name coverage [skip ci]" || exit 0
          git pull --rebase origin main
          git push
