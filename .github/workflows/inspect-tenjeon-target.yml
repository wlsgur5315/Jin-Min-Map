name: Inspect Tenjeon target building
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/inspect_tenjeon_target.py'
      - '.github/workflows/inspect-tenjeon-target.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/inspect_tenjeon_target.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenjeon_target_report.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Add Tenjeon target building diagnostic report [skip ci]"
            git pull --rebase origin main
            git push
          fi
