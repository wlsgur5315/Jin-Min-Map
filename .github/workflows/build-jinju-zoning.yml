name: Build Jinju zoning data
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_jinju_zoning.py'
      - '.github/workflows/build-jinju-zoning.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests remotezip geopandas pyogrio shapely pyproj
      - run: python tools/build_jinju_zoning.py
      - name: Commit zoning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zoning
          if git diff --cached --quiet; then
            echo "No zoning changes"
          else
            git commit -m "Build Jinju zoning GIS from EUM [skip ci]"
            git pull --rebase origin main
            git push
          fi
