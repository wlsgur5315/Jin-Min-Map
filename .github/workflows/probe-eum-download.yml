name: Probe EUM zoning download
# rerun endpoint probe
on:
  push:
    paths:
      - 'tools/probe_eum_download.py'
      - '.github/workflows/probe-eum-download.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tools/probe_eum_download.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eum_download_probe.json data/eum_svItemDet.js
          git commit -m "Probe EUM zoning download endpoint [skip ci]" || exit 0
          git pull --rebase origin main
          git push
