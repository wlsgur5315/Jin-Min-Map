name: Probe EUM file info
on:
  push:
    paths:
      - 'tools/eum_fileinfo_probe.py'
      - '.github/workflows/probe-eum-fileinfo.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tools/eum_fileinfo_probe.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eum_fileinfo_probe.json
          git commit -m "Probe latest EUM SHP file info [skip ci]" || exit 0
          git pull --rebase origin main
          git push
