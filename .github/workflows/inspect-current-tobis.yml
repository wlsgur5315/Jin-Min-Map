name: Inspect current Tobis records
on:
  push:
    paths:
      - 'tools/inspect_current_tobis.py'
      - '.github/workflows/inspect-current-tobis.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/inspect_current_tobis.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tobis_current_records.json
          git commit -m "Inspect current Tobis records [skip ci]" || exit 0
          git pull --rebase origin main
          git push
