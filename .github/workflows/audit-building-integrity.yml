name: Audit Jinju building integrity
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/audit_building_integrity.py'
      - '.github/workflows/audit-building-integrity.yml'
      - 'data/buildings/*.geojson.gz'
      - 'data/manifest.json'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/audit_building_integrity.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/building_integrity_audit.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Audit Jinju building integrity [skip ci]"
            git pull --rebase origin main
            git push
          fi
