name: Prioritize register area mismatches
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/prioritize_register_area_mismatches.py'
      - 'tools/classify_register_mismatch_types.py'
      - '.github/workflows/prioritize-register-area.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python tools/prioritize_register_area_mismatches.py
      - run: python tools/classify_register_mismatch_types.py
      - name: Commit priority report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/register_area_mismatch_priority.json data/register_mismatch_type_analysis.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Prioritize register area mismatches [skip ci]"
            git pull --rebase origin main
            git push
          fi
