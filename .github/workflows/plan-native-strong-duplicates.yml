name: Plan strong native duplicate cleanup
on:
  push:
    paths:
      - 'tools/plan_native_strong_duplicates.py'
      - '.github/workflows/plan-native-strong-duplicates.yml'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install shapely
      - run: python tools/plan_native_strong_duplicates.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/native_strong_duplicate_plan.json
          git commit -m "Plan strong native GIS duplicate cleanup [skip ci]" || exit 0
          git pull --rebase origin main
          git push
